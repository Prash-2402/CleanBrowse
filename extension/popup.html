<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanBrowse Settings</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent);
    }

    header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 6px;
      margin-right: 12px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .mode-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .mode-card.active {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .mode-card.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--primary);
    }

    .mode-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .mode-name {
      font-weight: 600;
      font-size: 14px;
    }

    .mode-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .active-badge {
      font-size: 10px;
      background: var(--primary);
      color: white;
      padding: 2px 6px;
      border-radius: 100px;
      font-weight: 700;
      display: none;
    }

    .active .active-badge {
      display: block;
    }

    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"></div>
      <h1>CleanBrowse</h1>
    </header>

    <div class="section-title">Age Protection Profile</div>
    
    <div class="mode-list" id="modeList">
      <!-- Modes will be injected here -->
    </div>

    <footer>
      <span class="status-dot"></span> Core System Active
    </footer>
  </div>
  <script src="extension-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
