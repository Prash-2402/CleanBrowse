<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanBrowse Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:    #7C3AED;
      --primary-lt: #EDE9FE;
      --teal:       #0EA5E9;
      --teal-lt:    #E0F2FE;
      --green:      #10B981;
      --green-lt:   #D1FAE5;
      --bg:         #F5F3FF;
      --card:       #FFFFFF;
      --text:       #1E1B4B;
      --muted:      #6B7280;
      --border:     rgba(124,58,237,0.12);
      --shadow:     0 4px 24px rgba(124,58,237,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      background: linear-gradient(135deg, #7C3AED 0%, #6366F1 50%, #0EA5E9 100%);
      padding: 18px 18px 22px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -40px; right: -30px;
    }
    .header::after {
      content: '';
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -20px; left: 10px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.22);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.3px;
      line-height: 1.1;
    }
    .brand-name span { color: rgba(255,255,255,0.75); font-weight: 700; }

    .brand-sub {
      font-size: 9.5px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 1px;
    }

    /* ─── BODY ─── */
    .body {
      padding: 16px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    /* ─── MODE CARDS ─── */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .mode-card:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: rgba(124,58,237,0.35);
      box-shadow: 0 6px 20px rgba(124,58,237,0.12);
    }

    .mode-card:active { transform: scale(0.98); }

    .mode-card.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%);
      box-shadow: 0 4px 18px rgba(124,58,237,0.20);
    }

    .mode-card.active::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,0.06), transparent);
      pointer-events: none;
    }

    .mode-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .mode-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-emoji {
      font-size: 20px;
      line-height: 1;
    }

    .mode-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .mode-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.45;
      padding-left: 28px;
      font-weight: 600;
    }

    .active-badge {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #7C3AED, #6366F1);
      color: white;
      padding: 3px 9px;
      border-radius: 99px;
      display: none;
      box-shadow: 0 2px 8px rgba(124,58,237,0.35);
    }

    .active .active-badge { display: block; }

    /* ─── FOOTER ─── */
    .footer {
      margin: 14px 16px 14px;
      padding: 10px 14px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(16,185,129,0.4);
      animation: pulse-ring 2s ease-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
      70%  { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .status-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
    }

    .shield-icon {
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">🛡️</div>
      <div class="brand-text">
        <div class="brand-name">Clean<span>Browse</span></div>
        <div class="brand-sub">Safe Internet Guard</div>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="section-label">🔑 Protection Profile</div>
    <div class="mode-list" id="modeList">
      <!-- Modes injected by popup.js -->
    </div>
  </div>

  <div class="footer">
    <div class="status-left">
      <div class="status-pulse"></div>
      <span class="status-text">Protection Active</span>
    </div>
    <span class="shield-icon">✨</span>
  </div>

  <script src="extension-config.js"></script>
  <script>
    // Inject kid-friendly emoji based on mode id
    const MODE_ICONS = { KID: '🧒', TEEN: '🧑' };
  </script>
  <script src="popup.js"></script>
  <script>
    // Patch renderModes to inject emoji into mode-left
    const _orig = window.renderModes;
    // We patch directly after load by overriding the innerHTML in cards
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.mode-card').forEach(card => {
        const id = card.dataset.id;
        const emoji = (MODE_ICONS[id] || '🛡️');
        const nameEl = card.querySelector('.mode-name');
        if (nameEl && !card.querySelector('.mode-emoji')) {
          const wrap = document.createElement('div');
          wrap.className = 'mode-left';
          const em = document.createElement('span');
          em.className = 'mode-emoji';
          em.textContent = emoji;
          wrap.appendChild(em);
          wrap.appendChild(nameEl.cloneNode(true));
          nameEl.replaceWith(wrap);
        }
      });
    });
  </script>
</body>
</html>
