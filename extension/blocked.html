<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanBrowse | Site Blocked</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff7ed;
        --card: #ffffff;
        --text: #7c2d12;
        --muted: #9a3412;
        --accent: #ea580c;
        --border: #fdba74;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #ffedd5, var(--bg));
        color: var(--text);
      }

      main {
        width: min(100%, 560px);
        padding: 32px;
        border: 2px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 20px 45px rgba(124, 45, 18, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.5;
        color: var(--muted);
      }

      code {
        display: block;
        margin-top: 16px;
        padding: 12px;
        overflow-wrap: anywhere;
        color: var(--text);
      }

      #ai-score-container {
        display: none;
        margin-top: 20px;
        padding: 10px;
        border-radius: 12px;
        background: #fdf2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        font-size: 13px;
        font-weight: 600;
        align-items: center;
        gap: 8px;
      }

      .ai-badge {
        background: #ef4444;
        color: white;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Site Blocked</h1>
      <p id="details">URL unavailable.</p>
      <code id="url"></code>
      
      <div id="ai-score-container">
        <span class="ai-badge">AI Analysis</span>
        <span>Safety Confidence: <span id="score">0</span>%</span>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
