<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanBrowse | Site Blocked</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary:   #7C3AED;
        --primary-g: linear-gradient(135deg, #7C3AED 0%, #6366F1 60%, #0EA5E9 100%);
        --soft-bg:   #F5F3FF;
        --card:      #FFFFFF;
        --text:      #1E1B4B;
        --muted:     #6B7280;
        --red:       #EF4444;
        --red-lt:    #FEF2F2;
        --orange:    #F97316;
        --orange-lt: #FFF7ED;
        --blue:      #0EA5E9;
        --blue-lt:   #E0F2FE;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Nunito', sans-serif;
        background: var(--soft-bg);
        position: relative;
        overflow: hidden;
      }

      /* Decorative background blobs */
      body::before {
        content: '';
        position: fixed;
        width: 500px; height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124,58,237,0.10) 0%, transparent 60%);
        top: -150px; left: -150px;
        pointer-events: none;
      }
      body::after {
        content: '';
        position: fixed;
        width: 400px; height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14,165,233,0.10) 0%, transparent 60%);
        bottom: -100px; right: -100px;
        pointer-events: none;
      }

      /* ─── MAIN CARD ─── */
      main {
        width: min(100%, 520px);
        background: var(--card);
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(124,58,237,0.14), 0 4px 16px rgba(0,0,0,0.06);
        overflow: hidden;
        position: relative;
        z-index: 1;
        animation: floatIn 0.55s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      @keyframes floatIn {
        from { opacity: 0; transform: translateY(30px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ─── TOP BANNER ─── */
      .banner {
        background: var(--primary-g);
        padding: 32px 36px 28px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .banner::before {
        content: '';
        position: absolute;
        width: 200px; height: 200px;
        border-radius: 50%;
        background: rgba(255,255,255,0.07);
        top: -80px; right: -60px;
      }
      .banner::after {
        content: '';
        position: absolute;
        width: 130px; height: 130px;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        bottom: -50px; left: -30px;
      }

      .shield-wrap {
        position: relative;
        display: inline-block;
        margin-bottom: 16px;
      }

      .shield-bg {
        width: 90px; height: 90px;
        border-radius: 24px;
        background: rgba(255,255,255,0.18);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.28);
        display: flex; align-items: center; justify-content: center;
        font-size: 44px;
        margin: 0 auto;
        box-shadow: 0 8px 32px rgba(0,0,0,0.14);
        animation: shieldPulse 3s ease-in-out infinite;
      }

      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,0,0,0.14); }
        50%       { transform: scale(1.04); box-shadow: 0 12px 40px rgba(124,58,237,0.3); }
      }

      .banner h1 {
        font-size: 26px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        position: relative;
        z-index: 1;
      }

      .banner-sub {
        font-size: 13px;
        color: rgba(255,255,255,0.78);
        font-weight: 600;
        position: relative;
        z-index: 1;
      }

      /* ─── CONTENT ─── */
      .content {
        padding: 24px 28px 28px;
      }

      /* Reason block */
      .reason-block {
        border-radius: 16px;
        padding: 14px 18px;
        margin-bottom: 18px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: #FEF2F2;
        border: 1.5px solid rgba(239,68,68,0.18);
        animation: slideIn 0.45s 0.2s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-12px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .reason-icon {
        font-size: 22px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .reason-body p {
        font-size: 13.5px;
        font-weight: 700;
        color: #991B1B;
        line-height: 1.5;
        margin: 0;
      }

      /* URL chip */
      .url-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #F8F7FF;
        border: 1.5px solid rgba(124,58,237,0.14);
        border-radius: 12px;
        padding: 11px 14px;
        margin-bottom: 18px;
        animation: slideIn 0.45s 0.32s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      .url-label {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--primary);
        flex-shrink: 0;
      }

      #url {
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      /* AI score */
      #ai-score-container {
        display: none;
        align-items: center;
        gap: 10px;
        background: #FFF7ED;
        border: 1.5px solid rgba(249,115,22,0.2);
        border-radius: 12px;
        padding: 11px 14px;
        margin-bottom: 18px;
        font-weight: 700;
        color: #9A3412;
        font-size: 13px;
        animation: slideIn 0.45s 0.4s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      .ai-badge {
        background: linear-gradient(135deg, #F97316, #EF4444);
        color: white;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(249,115,22,0.35);
      }

      /* Go back button */
      .btn-back {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        background: var(--primary-g);
        color: white;
        border: none;
        border-radius: 14px;
        font-family: 'Nunito', sans-serif;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
        box-shadow: 0 4px 18px rgba(124,58,237,0.30);
        animation: slideIn 0.45s 0.52s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      .btn-back:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(124,58,237,0.40);
      }

      .btn-back:active { transform: scale(0.97); }

      /* Footer note */
      .footer-note {
        text-align: center;
        margin-top: 16px;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 600;
        animation: slideIn 0.45s 0.60s cubic-bezier(0.34,1.2,0.64,1) both;
      }

      .footer-note strong {
        color: var(--primary);
      }

      /* Floating stars decoration */
      .stars {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .star {
        position: absolute;
        font-size: 14px;
        opacity: 0.6;
        animation: starFloat linear infinite;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="banner">
        <div class="shield-bg">🛡️</div>
        <h1>Oops! Blocked!</h1>
        <div class="banner-sub">CleanBrowse kept you safe 🌟</div>
      </div>

      <div class="content">

        <div class="reason-block">
          <span class="reason-icon">⚠️</span>
          <div class="reason-body">
            <p id="details">This page has been blocked for safety.</p>
          </div>
        </div>

        <div class="url-chip">
          <span class="url-label">URL</span>
          <span id="url">—</span>
        </div>

        <div id="ai-score-container">
          <span class="ai-badge">AI Analysis</span>
          <span>Safety Score: <strong><span id="score">0</span>%</strong> unsafe</span>
        </div>

        <a class="btn-back" href="javascript:history.back()">
          ← Go Back to Safety
        </a>

        <div class="footer-note">
          Protected by <strong>CleanBrowse</strong> — Safe Browsing for Kids 🌈
        </div>
      </div>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>
